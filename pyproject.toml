[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-replay-lab"
version = "0.1.0"
description = "Compare recorded agent tool sessions without rerunning side effects."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "XingCEO"}]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[project.scripts]
tool-replay-lab = "tool_replay_lab:main"

[project.urls]
Repository = "https://github.com/XingCEO/tool-replay-lab"
Issues = "https://github.com/XingCEO/tool-replay-lab/issues"

[tool.setuptools]
py-modules = ["tool_replay_lab"]
